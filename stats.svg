<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Chiffres clés" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.in{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.v{font:800 44px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#D8B06F}
.l{font:500 14px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#C4AD9D}
.ul{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:gx 1s forwards}
@keyframes gx{to{transform:scaleX(1.0)}}
.pd{animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.9}50%{opacity:.2}}
</style>
