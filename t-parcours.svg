<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Parcours">
<defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B88A47"/><stop offset="1" stop-color="#D8B06F"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D8B06F" stop-opacity="0"/><stop offset="0.5" stop-color="#D8B06F" stop-opacity="0.9"/><stop offset="1" stop-color="#D8B06F" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="90" rx="18"/></clipPath></defs>
<style>
.bar{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:g .8s .1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes g{to{transform:scaleY(1)}}
.n{font:500 15px ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;letter-spacing:3px;fill:#D8B06F;opacity:0;animation:f .8s .3s forwards}
.t{font:700 30px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#F4E9DE;opacity:0;animation:s .9s .35s cubic-bezier(.2,.8,.2,1) forwards}
.u{font:400 15px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#C4AD9D;opacity:0;animation:f .9s .7s forwards}
@keyframes f{to{opacity:1}}
@keyframes s{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.sh{animation:m 5s ease-in-out infinite}
@keyframes m{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}
</style>
<rect width="1200" height="90" rx="18" fill="#1A110D"/>
<g clip-path="url(#c)"><rect class="sh" x="0" y="86" width="600" height="4" fill="url(#sh)"/></g>
<rect x="1" y="1" width="1198" height="88" rx="17" fill="none" stroke="#43302A" stroke-width="2"/>
<rect class="bar" x="28" y="20" width="5" height="50" rx="2.5" fill="url(#gd)"/>
<text class="n" x="54" y="36">06</text>
<text class="t" x="54" y="68">Parcours</text>
<text class="u" x="1172" y="52" text-anchor="end">formation et expérience</text>
</svg>