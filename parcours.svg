<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 516" width="1200" height="516" role="img" aria-label="Parcours : Master SDSI en cours, Licence Génie Logiciel, DEUST MIP, PFE de Licence MEISA">
<style>.in{opacity:0;animation:u .8s cubic-bezier(.2,.8,.2,1) forwards}
