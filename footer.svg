<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Un stage PFE à proposer ? zendourmeriem7@gmail.com" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A110D"/><stop offset="1" stop-color="#2E1D14"/></linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B88A47"/><stop offset="1" stop-color="#D8B06F"/></linearGradient>
