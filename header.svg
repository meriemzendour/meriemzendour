@keyframes sw{0%{opacity:0;transform:translateY(12px)}5%{opacity:1;transform:none}28%{opacity:1;transform:none}33%{opacity:0;transform:translateY(-12px)}100%{opacity:0}}
.pill{opacity:0;animation:fi 1s 1.6s forwards}
.dot{animation:dp 1.6s ease-in-out infinite}
@keyframes dp{0%,100%{opacity:1}50%{opacity:.25}}
.spin1{transform-box:fill-box;transform-origin:center;animation:sp 38s linear infinite}
.spin2{transform-box:fill-box;transform-origin:center;animation:sp 26s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.mono{transform-box:fill-box;transform-origin:center;animation:br 5s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.wv{animation:wv linear infinite}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-600px)}}
</style>
