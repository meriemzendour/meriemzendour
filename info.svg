<rect x="0" y="15" width="400" height="100" rx="16" fill="#2A1B14" stroke="#43302A" stroke-width="2"/>
<rect x="0" y="15" width="5" height="100" rx="2.5" fill="#D8B06F" class="bar" style="animation-delay:0.76s"/>
<text x="28" y="50" class="k">LANGUES</text>
<text x="28" y="84" class="v">Arabe · Français · Anglais</text>
