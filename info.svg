<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Basée à Khouribga, Maroc. Master 2 SDSI. Langues : arabe, français, anglais" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.in{opacity:0;animation:u .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes u{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:g .8s forwards}
@keyframes g{to{transform:scaleY(1)}}
.k{font:500 12px ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;letter-spacing:3px;fill:#D8B06F}
.v{font:700 22px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#F4E9DE}
.s{font:400 13px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#C4AD9D}
</style>
<rect width="1200" height="130" rx="20" fill="#1A110D"/>
<g transform="translate(30,0)"><g class="in" style="animation-delay:0.00s">
<rect x="0" y="15" width="330" height="100" rx="16" fill="#2A1B14" stroke="#43302A" stroke-width="2"/>
<rect x="0" y="15" width="5" height="100" rx="2.5" fill="#D8B06F" class="bar" style="animation-delay:0.40s"/>
<text x="28" y="50" class="k">BASÉE À</text>
<text x="28" y="84" class="v">Khouribga, Maroc</text>
<text x="28" y="104" class="s"></text>
</g></g><g transform="translate(380,0)"><g class="in" style="animation-delay:0.18s">
<rect x="0" y="15" width="400" height="100" rx="16" fill="#2A1B14" stroke="#43302A" stroke-width="2"/>
