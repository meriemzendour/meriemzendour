<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Chaîne de la donnée au déploiement : collecte, ETL, Big Data, modèles, déploiement" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.fl{animation:d 1.2s linear infinite}
@keyframes d{to{stroke-dashoffset:-28}}
.pop{opacity:0;animation:pp .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rg{transform-box:fill-box;transform-origin:center;opacity:0;animation:r 3s ease-out infinite}
@keyframes r{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.num{font:800 26px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#D8B06F}
.st{font:700 20px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:#F4E9DE}
.tl{font:400 13px ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;fill:#C4AD9D}
</style>
<rect width="1200" height="220" rx="22" fill="#1A110D"/>
<rect x="1" y="1" width="1198" height="218" rx="21" fill="none" stroke="#43302A" stroke-width="2"/>
<line x1="160" y1="90" x2="320" y2="90" stroke="#D8B06F" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 8" class="fl"/><circle r="4" fill="#F4E9DE"><animateMotion dur="2.6s" begin="0.0s" repeatCount="indefinite" path="M160,90 L320,90"/></circle><line x1="400" y1="90" x2="560" y2="90" stroke="#D8B06F" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 8" class="fl"/><circle r="4" fill="#F4E9DE"><animateMotion dur="2.6s" begin="0.65s" repeatCount="indefinite" path="M400,90 L560,90"/></circle><line x1="640" y1="90" x2="800" y2="90" stroke="#D8B06F" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 8" class="fl"/><circle r="4" fill="#F4E9DE"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M640,90 L800,90"/></circle><line x1="880" y1="90" x2="1040" y2="90" stroke="#D8B06F" stroke-opacity=".7" stroke-width="2" stroke-dasharray="6 8" class="fl"/><circle r="4" fill="#F4E9DE"><animateMotion dur="2.6s" begin="1.9500000000000002s" repeatCount="indefinite" path="M880,90 L1040,90"/></circle><g style="animation-delay:0.00s" class="pop">
<circle cx="120" cy="90" r="40" fill="none" stroke="#D8B06F" class="rg" style="animation-delay:0.0s"/>
<circle cx="120" cy="90" r="34" fill="#2A1B14" stroke="#D8B06F" stroke-width="2"/>
<text x="120" y="100" text-anchor="middle" class="num">1</text>
<text x="120" y="160" text-anchor="middle" class="st">Collecte</text>
<text x="120" y="184" text-anchor="middle" class="tl">MQTT · capteurs IoT</text></g><g style="animation-delay:0.25s" class="pop">
<circle cx="360" cy="90" r="40" fill="none" stroke="#D8B06F" class="rg" style="animation-delay:0.6s"/>
<circle cx="360" cy="90" r="34" fill="#2A1B14" stroke="#D8B06F" stroke-width="2"/>
<text x="360" y="100" text-anchor="middle" class="num">2</text>
<text x="360" y="160" text-anchor="middle" class="st">ETL</text>
<text x="360" y="184" text-anchor="middle" class="tl">Talend · SQL · Pandas</text></g><g style="animation-delay:0.50s" class="pop">
<circle cx="600" cy="90" r="40" fill="none" stroke="#D8B06F" class="rg" style="animation-delay:1.2s"/>
<circle cx="600" cy="90" r="34" fill="#2A1B14" stroke="#D8B06F" stroke-width="2"/>
<text x="600" y="100" text-anchor="middle" class="num">3</text>
<text x="600" y="160" text-anchor="middle" class="st">Big Data</text>
<text x="600" y="184" text-anchor="middle" class="tl">Hadoop · Spark · Hive</text></g><g style="animation-delay:0.75s" class="pop">
<circle cx="840" cy="90" r="40" fill="none" stroke="#D8B06F" class="rg" style="animation-delay:1.8s"/>
<circle cx="840" cy="90" r="34" fill="#2A1B14" stroke="#D8B06F" stroke-width="2"/>
<text x="840" y="100" text-anchor="middle" class="num">4</text>
<text x="840" y="160" text-anchor="middle" class="st">Modèles</text>
<text x="840" y="184" text-anchor="middle" class="tl">XGBoost · LSTM · YOLOv8</text></g><g style="animation-delay:1.00s" class="pop">
<circle cx="1080" cy="90" r="40" fill="none" stroke="#D8B06F" class="rg" style="animation-delay:2.4s"/>
<circle cx="1080" cy="90" r="34" fill="#2A1B14" stroke="#D8B06F" stroke-width="2"/>
<text x="1080" y="100" text-anchor="middle" class="num">5</text>
